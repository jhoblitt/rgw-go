# Brings up one release's disposable one-worker Rook cluster on kind with a
# pinned rooket (hack/rooket/), and populates it. Run it after the caller's
# checkout, since a local action is read from the workspace. Diagnostics and
# teardown stay in the caller, after its last step: down.sh stops the rgw-go
# the caller started and removes out/<release>/, which rooket-action's post
# step, a rooket down --all after every step of the job, does not. Later steps
# get rooket on PATH and ROOKET_ENGINE in their environment.
name: rooket-cluster
description: Start and populate the disposable Rook cluster for one Ceph release

inputs:
  release:
    description: The Ceph release, squid or tentacle
    required: true

runs:
  using: composite
  steps:
    - name: Check the release
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: |
        case "$RELEASE" in
          squid | tentacle) ;;
          *) echo "::error::release is squid or tentacle, not '${RELEASE}'"; exit 1 ;;
        esac

    # Before rooket-action, which builds its helper with the Go on PATH.
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        check-latest: true

    # rooket is pinned here, so that it moves with this file and never with a
    # bump of the action. Bump the version and the sha256 of its linux_amd64
    # archive together, taking the hash from the release's checksums.txt once
    # its cosign bundle verifies (rooket-action's README, "The rooket pin").
    # kind, kubectl and helm come at the action's pins, kubectl at the minor
    # of its own rooket's node image: a rooket here whose node image is more
    # than one minor from that kubectl is outside kubectl's supported skew.
    - name: Prepare the runner and install rooket
      uses: jhoblitt/rooket-action@50c13c194401bb855130d7031e9fef095ac8f500 # v1.0.2
      with:
        rooket-version: v0.1.0
        rooket-sha256: f528fd390223bfcf12b10227c8be5851a9c5048ae45f2df41e0b3a6951d56e17

    # The runner holds no Ceph library: every command that links librados
    # runs in the release's builder and rgw-go in its derived image
    # (hack/rooket/README.md, "Running in the builder"), so a librados that a
    # runner image or an install brought in could only let a host build pass
    # for the wrong reason. The runner image's own gperftools (2.18.1 on
    # ubuntu-26.04) is left alone: nothing that runs on the host links it.
    # jq and the AWS CLI v2, which populate.sh, the harness scripts and the
    # workflows' scrub steps use, come with the runner image.
    - name: Check the runner's tools and that it holds no Ceph library
      shell: bash
      run: |
        jq --version
        aws --version
        # dpkg-query fails when a pattern matches no package, which pipefail
        # would let hide another pattern's match.
        if { dpkg-query -W -f '${db:Status-Abbrev} ${Package} ${Version}\n' 'librados*' 'libceph*' 2>/dev/null || true; } | grep '^ii'; then
          echo "::error::the runner holds a Ceph library"
          exit 1
        fi

    - name: Start the cluster
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: make cluster-up "RELEASE=${RELEASE}"

    - name: Populate the cluster
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: make populate "RELEASE=${RELEASE}"
