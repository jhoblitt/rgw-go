# Brings up one release's disposable one-worker Rook cluster on kind with a
# pinned rooket (hack/rooket/), and populates it. Run it after the caller's
# checkout, since a local action is read from the workspace. Diagnostics and
# teardown stay in the caller: a composite action has no post step, and the
# teardown must follow the caller's last step. Later steps get rooket on PATH
# and ROOKET_ENGINE in their environment.
name: rooket-cluster
description: Start and populate the disposable Rook cluster for one Ceph release

inputs:
  release:
    description: The Ceph release, squid or tentacle
    required: true

runs:
  using: composite
  steps:
    - name: Check the release
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: |
        case "$RELEASE" in
          squid | tentacle) ;;
          *) echo "::error::release is squid or tentacle, not '${RELEASE}'"; exit 1 ;;
        esac
        # The runner's rootful docker, so kind nodes get the host's iSCSI
        # block devices without the rootful-podman setup a runner otherwise
        # needs.
        echo "ROOKET_ENGINE=docker" >>"$GITHUB_ENV"

    # Deleting the preinstalled toolchains takes minutes, so it runs only
    # when the runner is short of what one worker's images and OSD need.
    - name: Free up runner disk
      shell: bash
      run: |
        df -h /
        avail_gb="$(df --output=avail -BG / | tail -n1 | tr -dc '0-9')"
        if [ "$avail_gb" -ge 40 ]; then
          echo "${avail_gb}G free; skipping cleanup"
          exit 0
        fi
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/lib/jvm \
          /usr/share/swift /usr/local/share/powershell || true
        df -h /

    # Ceph 19.2.6 and 20.2.4 create AES256KRB5 cephx keys, which noble's
    # librados 19.2.3 cannot parse, so librados comes from download.ceph.com.
    # Squid 19.2.6 has no noble build; a Tentacle client serves both clusters.
    # The image's AWS CLI v2 serves populate.sh; noble has no awscli package.
    - name: Install librados headers and jq
      shell: bash
      env:
        CEPH_KEY_FPR: 08B73419AC32B4E966C1A330E84AC2C0460F3994
      run: |
        curl -fsSL https://download.ceph.com/keys/release.asc | gpg --dearmor >ceph.gpg
        gpg --show-keys --with-colons ceph.gpg | grep -qx "fpr:::::::::${CEPH_KEY_FPR}:"
        sudo install -m 0644 ceph.gpg /usr/share/keyrings/ceph.gpg && rm ceph.gpg
        echo "deb [signed-by=/usr/share/keyrings/ceph.gpg] https://download.ceph.com/debian-20.2.4 noble main" |
          sudo tee /etc/apt/sources.list.d/ceph.list >/dev/null
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends librados-dev jq
        dpkg-query -W librados2
        aws --version

    # Each tool's sha256 is pinned beside its version, so a download is
    # checked against a value the host serving it did not supply. Bump both
    # together, taking the hash from a second source: the GitHub release for
    # kind and helm, and for kubectl the client tarball whose sha512 the
    # Kubernetes changelog lists.
    - name: Install kind, kubectl and helm
      shell: bash
      env:
        KIND_VERSION: v0.32.0
        KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        # The minor of the kind node image that rooket pins.
        KUBECTL_VERSION: v1.33.1
        KUBECTL_SHA256: 5de4e9f2266738fd112b721265a0c1cd7f4e5208b670f811861f699474a100a3
        HELM_VERSION: v3.20.1
        HELM_SHA256: 0165ee4a2db012cc657381001e593e981f42aa5707acdd50658326790c9d0dc3
      run: |
        set -eux
        tmp="$(mktemp -d)"
        cd "$tmp"
        curl -fsSLO "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
        echo "${KIND_SHA256}  kind-linux-amd64" | sha256sum -c -
        sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind
        curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
        sudo install -m 0755 kubectl /usr/local/bin/kubectl
        helm_tgz="helm-${HELM_VERSION}-linux-amd64.tar.gz"
        curl -fsSLO "https://get.helm.sh/${helm_tgz}"
        echo "${HELM_SHA256}  ${helm_tgz}" | sha256sum -c -
        tar -xzf "$helm_tgz" linux-amd64/helm
        sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
        cd / && rm -rf "$tmp"
        kind version && kubectl version --client && helm version && docker version

    # The OSD's disk is an iSCSI target; rooket sets it up through the
    # runner's passwordless sudo. The runner is both ends: LIO serves a
    # fileio backstore over iSCSI (configfs, target_core_mod,
    # target_core_file, iscsi_target_mod) and the initiator logs in over
    # iscsi_tcp. None is optional, so a missing one fails here by name
    # rather than later inside rooket.
    - name: Install iSCSI and LVM tooling
      shell: bash
      run: |
        set -eux
        sudo apt-get install -y open-iscsi targetcli-fb lvm2
        sudo modprobe -a configfs target_core_mod target_core_file iscsi_target_mod iscsi_tcp
        sudo systemctl enable --now iscsid

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # go1.27.2 explicitly until actions/go-versions lists it, since
        # check-latest resolves only from that manifest; then go back to
        # go-version-file: go.mod with check-latest: true.
        go-version: "1.27.2"

    - name: Install rooket
      shell: bash
      env:
        CGO_ENABLED: "0"
        # rooket is untagged: a commit on its main, bumped by hand.
        ROOKET_VERSION: 9e9ab38e18dc53d8ea092222a37b6d8c5b0032b9
      run: |
        GOBIN="${RUNNER_TEMP}/bin" go install "github.com/jhoblitt/rooket@${ROOKET_VERSION}"
        echo "${RUNNER_TEMP}/bin" >>"$GITHUB_PATH"

    - name: Start the cluster
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: make cluster-up "RELEASE=${RELEASE}"

    - name: Populate the cluster
      shell: bash
      env:
        RELEASE: ${{ inputs.release }}
      run: make populate "RELEASE=${RELEASE}"
