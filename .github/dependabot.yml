# Managed by github-conventions (references/workflows.md); language plugins
# append their own package-ecosystem entries below this one.
version: 2
updates:
  - package-ecosystem: github-actions
    # / reaches .github/workflows/ and a root action.yml only; a local
    # composite action's pins need its own directory listed.
    directories:
      - /
      - /.github/actions/rooket-cluster
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
  # The Go entry, from go-conventions (references/ci.md, Dependabot), which
  # owns how it lands in .github/dependabot.yml.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns: ["*"]
  # The Go toolchain image the builder stage copies from (hack/image/Containerfile.builder).
  - package-ecosystem: docker
    directory: /hack/image
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # CI builds with go.mod's go directive, so the builder's Go moves to a new
    # minor only with that directive, by hand; patch and digest bumps still
    # come. Dependabot names the image library/golang.
    ignore:
      - dependency-name: "*golang"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
