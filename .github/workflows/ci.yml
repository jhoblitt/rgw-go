# Managed by go-conventions (references/ci.md owns the Go jobs; the workflow
# hygiene this complies with is github-conventions' references/workflows.md).
# Every job compiles go-ceph, so each runs its commands in a release's builder
# (hack/image/run.sh): the Ceph image's own librados, tcmalloc, glibc and Go,
# whatever the runner's OS ships. Of the runner they take only docker and the
# shell tools that start them, so no job installs Go or a Ceph package. That
# is also why the lint and govulncheck jobs run their tools in the builder
# rather than through golangci-lint-action and govulncheck-action, which run
# on the runner. Tentacle's builder serves every job but build-squid, which
# compiles and links everything against Squid's librados, as the Squid
# release does.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# The builder action and run.sh use docker, the image store the cache loads.
env:
  RGW_GO_ENGINE: docker

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Tentacle's builder
        uses: ./.github/actions/builder
        with:
          release: tentacle
          gocache: test

      # The Makefile is the one home of the build tags.
      - name: Test with race detector and coverage, in Tentacle's builder
        run: |
          hack/image/run.sh -- tentacle go test "-tags=$(make -s print-go-tags)" -race -count=1 -timeout=25m \
            -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  # The check image is Tentacle's builder with golangci-lint at the Makefile's
  # pin, the version's one home (hack/image/Containerfile.check).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Tentacle's builder
        uses: ./.github/actions/builder
        with:
          release: tentacle
          gocache: lint

      - name: golangci-lint, in Tentacle's check image
        env:
          RGW_GO_STAGE: check
        run: hack/image/run.sh -- tentacle make lint

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Tentacle's builder
        uses: ./.github/actions/builder
        with:
          release: tentacle
          gocache: checks

      - name: go vet, go fix, go mod tidy, go generate leave no diff; release pins and parity options match; bench datasets fit; ledgers valid; Ceph citations in markdown and Go comments are links
        run: |
          hack/image/run.sh -- tentacle make vet fix-check tidy-check generate-check release-pins-check \
            parity-options-check bench-plan-check ledger-check citation-form-check citation-go-check

  # govulncheck at latest, as govulncheck-action installs it.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Tentacle's builder
        uses: ./.github/actions/builder
        with:
          release: tentacle
          gocache: govulncheck

      - name: govulncheck, in Tentacle's builder
        run: hack/image/run.sh -- tentacle go run golang.org/x/vuln/cmd/govulncheck@latest "-tags=$(make -s print-go-tags)" ./...

  # Nothing else compiles against Squid's librados before a release does. The
  # race build matches Squid's integration job, whose Go build cache falls
  # back to this one's.
  build-squid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load Squid's builder
        uses: ./.github/actions/builder
        with:
          release: squid
          gocache: build-squid

      - name: Build every package and link every test against Squid's librados, running none
        run: |
          tags=$(make -s print-go-tags)
          hack/image/run.sh -- squid go build "-tags=${tags}" ./...
          hack/image/run.sh -- squid go test "-tags=${tags}" -race -count=1 -run '^$' ./...
