# Managed by go-conventions (references/release.md owns the release contract;
# the workflow hygiene this complies with is github-conventions' references/workflows.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialized on a constant group and never cancelled mid-run: two tags pushed
# together would otherwise race to publish the same artifacts.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Two cgo builds, each in a builder made from its release's Ceph image, and
    # two images derived from those Ceph images pushed to ghcr.io.
    timeout-minutes: 60
    # Forks must not publish under the upstream name.
    if: github.repository == 'jhoblitt/rgw-go'
    permissions:
      contents: write
      packages: write
      id-token: write
    # cgo-build.sh prefers podman when it is installed; with docker, which
    # goreleaser builds the images with, each Ceph image is pulled into one
    # image store.
    env:
      RGW_GO_ENGINE: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The stamp assertion's build links go-ceph, so it needs librados's
      # headers and library; it never connects to a cluster.
      - name: Install librados headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librados-dev

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Assert .goreleaser.yaml's Ceph images and build tags match their homes
        run: make release-pins-check

      # The binary carries no -X ldflags: go build stamps the module version
      # from the tag. Prove the checkout produces that stamp before releasing.
      - name: Assert the tag is the version the binary reports
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "1"
        run: |
          go build "-tags=$(make -s print-go-tags)" -o "$RUNNER_TEMP/rgw-go" ./cmd/rgw-go
          stamped=$(go version -m "$RUNNER_TEMP/rgw-go" | awk '$1 == "mod" { print $3 }')
          [ "$stamped" = "$TAG" ] || { echo "binary stamped '$stamped', want '$TAG'"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without GORELEASER_CURRENT_TAG goreleaser releases the highest-sorting
      # tag on the commit, and v0.1.0-rc.1 sorts above v0.1.0, so a final tag
      # pushed to a release candidate's commit would release as the candidate.
      # This binds it to the tag the stamp assertion checked.
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
