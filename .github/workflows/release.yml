# Managed by go-conventions (references/release.md owns the release contract;
# the workflow hygiene this complies with is github-conventions' references/workflows.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Serialized on a constant group and never cancelled mid-run: two tags pushed
# together would otherwise race to publish the same artifacts.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # Two cgo builds, each in a builder made from its release's Ceph image, and
    # two images derived from those Ceph images pushed to ghcr.io.
    timeout-minutes: 60
    # Forks must not publish under the upstream name.
    if: github.repository == 'jhoblitt/rgw-go'
    permissions:
      contents: write
      packages: write
      id-token: write
    # cgo-build.sh prefers podman when it is installed; with docker, which
    # goreleaser builds the images with, each Ceph image is pulled into one
    # image store.
    env:
      RGW_GO_ENGINE: docker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # goreleaser reads the module through the runner's go, and the stamp
      # assertion reads the binary's stamp with it; neither links librados.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Assert .goreleaser.yaml's Ceph images and build tags match their homes
        run: make release-pins-check

      # The binary carries no -X ldflags: go build stamps the module version
      # from the tag. Prove the checkout produces that stamp before releasing.
      # It builds as goreleaser's builds do, in Tentacle's builder through
      # run.sh, which cgo-build.sh runs, and which builds the builder from
      # this commit and no cache. The output is under hack/image/out/, which
      # git ignores, so the tree goreleaser finds stays clean.
      - name: Assert the tag is the version the binary reports
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: "1"
        run: |
          bin=hack/image/out/rgw-go-stamp
          hack/image/run.sh -- tentacle go build "-tags=$(make -s print-go-tags)" -o "${bin}" ./cmd/rgw-go
          stamped=$(go version -m "${bin}" | awk '$1 == "mod" { print $3 }')
          [ "$stamped" = "$TAG" ] || { echo "binary stamped '$stamped', want '$TAG'"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Without GORELEASER_CURRENT_TAG goreleaser releases the highest-sorting
      # tag on the commit, and v0.1.0-rc.1 sorts above v0.1.0, so a final tag
      # pushed to a release candidate's commit would release as the candidate.
      # This binds it to the tag the stamp assertion checked.
      - name: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
