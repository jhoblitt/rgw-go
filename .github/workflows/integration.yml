# The integration suite and the phase 0 gate against disposable one-worker
# Squid and Tentacle Rook clusters on kind, which rooket stands up
# (hack/rooket/). Nightly and on demand; it does not gate pull requests.
name: integration

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  cluster:
    name: ${{ matrix.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        release: [squid, tentacle]
    env:
      RELEASE: ${{ matrix.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools' and rooket's pins live in the action, which s3tests.yml
      # shares.
      - name: Start and populate the cluster
        uses: ./.github/actions/rooket-cluster
        with:
          release: ${{ matrix.release }}

      - name: Integration suite
        run: make integration "RELEASE=${RELEASE}"

      - name: Phase 0 gate
        run: make gate "RELEASE=${RELEASE}"

      # Collected before teardown, which removes the cluster and out/. A
      # timeout cancels the job rather than failing it. diag.sh leaves out the
      # admin keyring and the populated users' S3 secrets.
      - name: Collect cluster diagnostics
        if: failure() || cancelled()
        timeout-minutes: 10
        run: hack/rooket/diag.sh "${RELEASE}" "${RUNNER_TEMP}/diagnostics"

      - name: Upload cluster diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cluster-${{ matrix.release }}
          path: ${{ runner.temp }}/diagnostics
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down the cluster
        if: always()
        run: |
          command -v rooket >/dev/null || { echo "rooket was never installed; nothing to tear down"; exit 0; }
          make cluster-down "RELEASE=${RELEASE}"
