# The integration suite, the phase 0 gate and the admin checks against
# disposable one-worker Squid and Tentacle Rook clusters on kind, which rooket
# stands up (hack/rooket/). The admin checks are radosgw's go-ceph rgw/admin
# baseline, make admin-parity and make admin-gate. The seam microbenchmark is
# not run here. Nightly and on demand; it does not gate pull requests.
name: integration

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  cluster:
    name: ${{ matrix.release }}
    # Forks must not spend a pair of cluster runs a night on the upstream gate.
    if: github.repository == 'jhoblitt/rgw-go'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        release: [squid, tentacle]
    env:
      RELEASE: ${{ matrix.release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools' and rooket's pins live in the action, which s3tests.yml
      # shares.
      - name: Start and populate the cluster
        id: cluster
        uses: ./.github/actions/rooket-cluster
        with:
          release: ${{ matrix.release }}

      # Each check runs once the step it needs has succeeded, whatever the
      # checks before it did, so one failure does not hide the others; the
      # job still fails with any of them.
      - name: Integration suite
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: make integration "RELEASE=${RELEASE}"

      # Before the admin steps: the gate counts users, and the suites create
      # and remove their own.
      - name: Phase 0 gate
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: make gate "RELEASE=${RELEASE}"

      # Before radosgw's suite too: rgw-go-up sets the parity options on
      # radosgw's entity as well, and radosgw's baseline was recorded under
      # them (make admin-record).
      - name: Start rgw-go
        id: rgw-go
        if: ${{ !cancelled() && steps.cluster.outcome == 'success' }}
        run: make rgw-go-up "RELEASE=${RELEASE}"

      # radosgw's own rgw/admin baseline, recorded in test/admin/baseline/. A
      # drift here is a change in the Ceph image or the go-ceph tag, never an
      # rgw-go bug: re-record on purpose (hack/rooket/README.md).
      - name: go-ceph rgw/admin suite against radosgw
        id: radosgw-suite
        if: ${{ !cancelled() && steps.rgw-go.outcome == 'success' }}
        run: make admin-suite "RELEASE=${RELEASE}" GATEWAY=radosgw RUN=nightly

      # The meta make admin-record writes, so that a run under another Ceph
      # version, go-ceph tag or deselect list exits 2, the prompt to
      # re-record. hack/parity runs built, as the Makefile runs it, because go
      # run exits 1 for any failure.
      - name: Compare with the recorded rgw/admin baseline
        id: baseline
        if: ${{ !cancelled() && steps.radosgw-suite.outcome == 'success' }}
        run: |
          ceph_version=$(jq -er .ceph_version "hack/rooket/out/${RELEASE}/manifest.json")
          tag=$(hack/admin/run.sh --print-tag)
          deselect=$(hack/admin/run.sh --print-deselect)
          candidate="${RUNNER_TEMP}/admin-radosgw-nightly.json"
          go build -o bin/parity ./hack/parity
          bin/parity record --format gotest --suite admin --out "${candidate}" \
            --meta "release=${RELEASE}" --meta "ceph_version=${ceph_version}" --meta gateway=radosgw \
            --meta "go_ceph_tag=${tag}" --meta "deselect=${deselect}" \
            "hack/admin/_out/${RELEASE}-radosgw-nightly.jsonl"
          bin/parity diff --baseline "test/admin/baseline/${RELEASE}.json" --candidate "${candidate}"

      - name: go-ceph rgw/admin suite against rgw-go, compared with radosgw's baseline
        if: ${{ !cancelled() && steps.rgw-go.outcome == 'success' }}
        run: make admin-parity "RELEASE=${RELEASE}"

      - name: Admin gate
        if: ${{ !cancelled() && steps.rgw-go.outcome == 'success' }}
        run: make admin-gate "RELEASE=${RELEASE}"

      # Collected before teardown, which removes the cluster and out/. A
      # timeout cancels the job rather than failing it. diag.sh leaves out the
      # admin keyring and the populated users' S3 secrets.
      - name: Collect cluster diagnostics
        if: failure() || cancelled()
        timeout-minutes: 10
        run: hack/rooket/diag.sh "${RELEASE}" "${RUNNER_TEMP}/diagnostics"

      - name: Upload cluster diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cluster-${{ matrix.release }}
          path: ${{ runner.temp }}/diagnostics
          retention-days: 14
          if-no-files-found: ignore

      # The artifact is public, and the suite's debug client writes every
      # admin response into its report, the S3 and Swift secret keys radosgw
      # and rgw-go generate for the suite's users among them, each 40 letters
      # and digits. The reports are copied out of hack/admin/_out/, which also
      # holds the go-ceph checkout, and in the copies every standalone run of
      # exactly 40 letters and digits is redacted, a run that follows a JSON
      # escape (\n, \r, \t, \uXXXX) counting as standalone. Three guards then
      # block the upload, and run before teardown, which removes out/:
      # - in the copies as written, a keyring line or a cephx key in either
      #   encoding Squid and Tentacle create, AES ("AQ", 40 characters) or
      #   AES256KRB5 ("Ag", 60);
      # - in the copies as written, any secret out/ holds verbatim: the
      #   populated users' S3 secrets in manifest.json and every keyring's key;
      # - in each copy's joined output, a secret field followed by 40 letters
      #   and digits: secret_key in JSON, its quotes escaped or not,
      #   <SecretKey> in XML, or secret-key= in a query string. go test -json
      #   splits a stdout line longer than 1024 bytes into several output
      #   events, so a secret can straddle two events as two pieces too short
      #   for the redaction; joining every event's Output in order, with any
      #   line that is not JSON kept as it is, puts it back together. A .log
      #   is go test's stderr, plain text, and is its own joined output.
      - name: Drop key material from the admin reports
        id: admin-scrub
        if: failure() || cancelled()
        env:
          STAGE: ${{ runner.temp }}/admin-reports
          JOINED: ${{ runner.temp }}/admin-reports-joined
        run: |
          shopt -s nullglob
          reports=(hack/admin/_out/*.jsonl hack/admin/_out/*.log)
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "the admin suite left no report"
            exit 0
          fi
          mkdir -p "${STAGE}" "${JOINED}"
          cp "${reports[@]}" "${STAGE}/"
          perl -pi -e 's/(?:(?<![A-Za-z0-9])|(?<=\\[nrt])|(?<=\\u[0-9a-fA-F]{4}))[A-Za-z0-9]{40}(?![A-Za-z0-9])/<redacted>/g' "${STAGE}"/*
          for report in "${STAGE}"/*.jsonl; do
            jq -j -R '. as $line | (try fromjson catch null) as $e
              | if ($e | type) != "object" then $line + "\n"
                elif $e.Action == "output" then $e.Output // ""
                else empty end' "${report}" >"${JOINED}/${report##*/}"
          done
          for report in "${STAGE}"/*.log; do
            cp "${report}" "${JOINED}/"
          done
          out="hack/rooket/out/${RELEASE}"
          known="${RUNNER_TEMP}/known-secrets"
          : >"${known}"
          if [ -f "${out}/manifest.json" ]; then
            jq -r '.users[]?.secret_key // empty' "${out}/manifest.json" >>"${known}"
          fi
          for keyring in "${out}"/*.keyring; do
            awk '$1 == "key" && $2 == "=" { print $3 }' "${keyring}" >>"${known}"
          done
          blocked=0
          # guard WHAT DIR GREP-ARGS... marks the upload blocked when a file in
          # DIR matches.
          guard() {
            local what=$1 dir=$2 rc=0 hits
            shift 2
            hits=$(grep -rl "$@" "${dir}") || rc=$?
            case "${rc}" in
              0)
                printf '%s in:\n%s\n' "${what}" "${hits}"
                blocked=1
                ;;
              1) ;;
              *)
                echo "::error::grep could not read ${dir}"
                blocked=1
                ;;
            esac
          }
          guard "a keyring line or a cephx key" "${STAGE}" -E 'key = |AQ[A-Za-z0-9+/]{36}==|Ag[A-Za-z0-9+/]{57}='
          guard "a secret out/ holds" "${STAGE}" -F -f "${known}"
          guard "a secret field's 40-character value, in the joined output" "${JOINED}" \
            -E 'secret_key\\?"[[:space:]]*:[[:space:]]*\\?"[A-Za-z0-9]{40}|<SecretKey>[A-Za-z0-9]{40}|secret-key=[A-Za-z0-9]{40}'
          rm -rf "${known}" "${JOINED}"
          if [ "${blocked}" -ne 0 ]; then
            echo "::error::key material left in the admin reports; the upload is blocked"
            exit 1
          fi
          echo "no key material left in ${STAGE}"

      - name: Upload the admin reports
        if: (failure() || cancelled()) && steps.admin-scrub.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-${{ matrix.release }}
          path: ${{ runner.temp }}/admin-reports
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down the cluster
        if: always()
        run: |
          command -v rooket >/dev/null || { echo "rooket was never installed; nothing to tear down"; exit 0; }
          make cluster-down "RELEASE=${RELEASE}"
