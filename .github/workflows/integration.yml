# The integration suite, the phase 0 gate and the admin checks against
# disposable one-worker Squid and Tentacle Rook clusters on kind, which rooket
# stands up (hack/rooket/). The admin checks are radosgw's go-ceph rgw/admin
# baseline, make admin-parity and make admin-gate. The seam microbenchmark is
# not run here. On every pull request, both releases, and on demand. Each
# release's job is integration-cluster.yml, called once per release.
#
# The workflow always starts and its changes job decides whether the pull
# request needs the clusters: a required check that a trigger's path filter
# keeps from starting stays pending and blocks the merge. The integration job
# is the one to require. A job skipped by its if: reports success, and GitHub
# skips a job whose needed job failed, so requiring the release jobs
# themselves would let a broken filter merge green.
name: integration

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keyed by event too, so that a dispatch never cancels a pull request's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The clusters are skipped only when every file the pull request
      # changes is one no step reads: markdown, docs/, LICENSE, the s3-tests
      # records under test/s3tests/, the other workflows and their files under
      # .github/, and the commitlint, lint and release configs. Any other
      # file, one no pattern names included, runs them, as does a pull request
      # that changes no file. Three dots count the pull request's own changes
      # only; --no-renames counts a moved file by its old name too; -z lists a
      # name as it is, where git would quote one holding a non-ASCII or
      # control character; and %q keeps a name from writing a line of its own
      # to the log, where a workflow command could start.
      - name: Decide whether the pull request needs the clusters
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files="${RUNNER_TEMP}/changed-files"
          git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" >"$files"
          run=false
          changed=0
          while IFS= read -r -d '' path; do
            changed=$((changed + 1))
            case "$path" in
              .github/workflows/integration.yml | .github/workflows/integration-cluster.yml) skip=false ;;
              docs/* | *.md | LICENSE | test/s3tests/* | .commitlintrc.yml | .golangci.yml | .goreleaser.yaml | \
                .github/dependabot.yml | .github/commitlint/* | .github/tools/* | .github/workflows/*)
                skip=true
                ;;
              *) skip=false ;;
            esac
            if [ "$skip" = false ]; then
              printf 'needs the clusters: %q\n' "$path"
              run=true
            fi
          done <"$files"
          if [ "$changed" -eq 0 ]; then
            echo "the pull request changes no file"
            run=true
          fi
          echo "run=${run}"
          echo "run=${run}" >>"$GITHUB_OUTPUT"

  # A fork's own pull requests must not spend a pair of cluster runs on the
  # upstream gate. There the integration job fails, as it does for any skip
  # the filter did not decide.
  squid:
    needs: changes
    if: github.repository == 'jhoblitt/rgw-go' && needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/integration-cluster.yml
    with:
      release: squid

  tentacle:
    needs: changes
    if: github.repository == 'jhoblitt/rgw-go' && needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/integration-cluster.yml
    with:
      release: tentacle

  # The required check. It passes when the filter ran and either each
  # release's job passed or the pull request needs no cluster and each was
  # skipped; anything else fails it, a release that never ran included. A
  # call's result is GitHub's undocumented roll-up of the called job's, so a
  # release passes only with its passed output too, which no job that never
  # ran can write.
  integration:
    needs: [changes, squid, tentacle]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Judge the filter and each release's run
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          SQUID: ${{ needs.squid.result }}
          SQUID_PASSED: ${{ needs.squid.outputs.passed }}
          TENTACLE: ${{ needs.tentacle.result }}
          TENTACLE_PASSED: ${{ needs.tentacle.outputs.passed }}
        run: |
          echo "changes: ${CHANGES}, run: ${RUN:-unset}," \
            "squid: ${SQUID} passed=${SQUID_PASSED:-unset}, tentacle: ${TENTACLE} passed=${TENTACLE_PASSED:-unset}"
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job ended ${CHANGES}"
            exit 1
          fi
          case "$RUN" in
            true) want=success ;;
            false) want=skipped ;;
            *)
              echo "::error::the changes job set no run output"
              exit 1
              ;;
          esac
          failed=0
          # judge RELEASE RESULT PASSED
          judge() {
            if [ "$2" != "$want" ]; then
              echo "::error::$1 ended $2 with run=${RUN}, where ${want} was due"
              failed=1
            elif [ "$want" = success ] && [ "$3" != true ]; then
              echo "::error::$1 ended success, but its job did not record a pass"
              failed=1
            fi
          }
          judge squid "$SQUID" "$SQUID_PASSED"
          judge tentacle "$TENTACLE" "$TENTACLE_PASSED"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          if [ "$want" = success ]; then
            echo "squid and tentacle both passed"
          else
            echo "the pull request needs no cluster"
          fi
